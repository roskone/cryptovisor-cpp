name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы прикладывать установщик к релизу

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          cache: true

      # MSVC-окружение для Ninja — не зависит от версии Visual Studio на раннере
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4 --target cryptovisor test_ciphers test_keys

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/CryptoVisor | Out-Null
          Copy-Item build/cryptovisor.exe dist/CryptoVisor/
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist/CryptoVisor/cryptovisor.exe

      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CryptoVisor-Setup
          path: dist/CryptoVisor-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryptoVisor-Setup-*.exe
